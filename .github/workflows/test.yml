name: Test Formulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
      fail-fast: false

    name: Test (Ruby ${{ matrix.ruby-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Tap this repository
        run: brew tap zdennis/bin .

      - name: Trust this tap
        run: brew trust zdennis/bin

      - name: List available formulas
        run: |
          echo "Available formulas:"
          ls -1 Formula/*.rb | sed 's|Formula/||; s|\.rb$||' | sort

      - name: Install all formulas
        run: |
          # Install each formula individually so we can skip or tolerate known issues:
          # - work-coordinator: private GitHub repo, not accessible in public CI
          # - html-viewer: Electron dylib relinking fails cosmetically (exit 1) but
          #   the keg installs correctly; treat non-zero exit as acceptable.
          # - zdennis-bin-all: depends on work-coordinator, so install it last after
          #   skipping that dep; it will fail if work-coordinator isn't present, so skip it too.
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            if [[ "$name" == "work-coordinator" || "$name" == "zdennis-bin-all" ]]; then
              echo "Skipping $name install (private dep or meta-formula)"
              continue
            fi
            echo "Installing $name..."
            if [[ "$name" == "html-viewer" ]]; then
              brew install "zdennis/bin/$name" || true
            else
              brew install "zdennis/bin/$name"
            fi
          done

      - name: Test all formulas
        run: |
          echo "=== Testing all formulas ==="
          failed=0
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            # work-coordinator: private GitHub repo, not accessible in public CI
            # zdennis-bin-all: meta-formula that depends on work-coordinator, can't install
            if [[ "$name" == "work-coordinator" || "$name" == "zdennis-bin-all" ]]; then
              echo "Skipping $name (private dep or requires work-coordinator)"
              continue
            fi
            echo ""
            echo "Testing $name..."
            if brew test "zdennis/bin/$name"; then
              echo "✓ $name passed"
            else
              echo "✗ $name failed"
              failed=1
            fi
          done
          exit $failed

      - name: Show installed tools summary
        run: brew list --formula | grep -E '^(alias-directory|ascii-banner|code\+x|codep|expand-keyword|html-viewer|queue-commands|retry-command|run-through|set-random-background-color|touchp|window-tool|workspace)' || true
