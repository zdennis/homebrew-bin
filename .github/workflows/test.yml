name: Test Formulas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    strategy:
      matrix:
        ruby-version: ['3.4', '4.0']
      fail-fast: false

    name: Test (Ruby ${{ matrix.ruby-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Tap this repository
        run: brew tap zdennis/bin .

      - name: Trust this tap
        run: brew trust zdennis/bin

      - name: List available formulas
        run: |
          echo "Available formulas:"
          ls -1 Formula/*.rb | sed 's|Formula/||; s|\.rb$||' | sort

      - name: Install all formulas
        run: |
          # Install zdennis-bin-all which depends on all other tools except work-coordinator
          # (private repo, not accessible in public CI).
          # html-viewer bundles pre-built Electron binaries whose Mach-O headers lack
          # space for Homebrew's dylib relinking; the keg installs correctly but brew
          # exits 1 due to the cosmetic linkage warning. Ensure it is present after.
          brew install zdennis/bin/zdennis-bin-all || brew install zdennis/bin/html-viewer

      - name: Test all formulas
        run: |
          echo "=== Testing all formulas ==="
          failed=0
          for formula in Formula/*.rb; do
            name=$(basename "$formula" .rb)
            # work-coordinator sources from a private GitHub repo — skip in public CI
            if [[ "$name" == "work-coordinator" ]]; then
              echo "Skipping $name (private repo, not accessible in public CI)"
              continue
            fi
            echo ""
            echo "Testing $name..."
            if brew test "zdennis/bin/$name"; then
              echo "✓ $name passed"
            else
              echo "✗ $name failed"
              failed=1
            fi
          done
          exit $failed

      - name: Show installed tools summary
        run: zdennis-bin-all
